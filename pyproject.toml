[project]
name = "call-me-maybe"
version = "0.1.0"
description = "Introduction to LLM function calling, part of the 42 curriculum."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "flake8>=7.3.0",
    "llm-sdk",
    "mypy>=1.20.1",
    "numpy>=2.2.6",
    "pydantic>=2.13.0"
]

[tool.uv.workspace]
members = [
    "llm_sdk",
]

[tool.uv.sources]
llm-sdk = { workspace = true }

[tool.pytest.ini_options]
pythonpath = ["."]